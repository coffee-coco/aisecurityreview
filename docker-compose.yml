# Sentinel production stack: Postgres, Redis, migrations, API, autoscaled Celery workers.
#
#   cp .env.example .env    # set POSTGRES_PASSWORD and APP_SECRET_KEY
#   docker compose up -d --build
#   docker compose logs -f api      # email verification codes are printed here
#
# Only named volumes are used by the app containers so the autoscaler can run `docker compose` from inside
# its own container (bind-mount paths would resolve against the autoscaler's filesystem).
name: sentinel

x-app: &app
  build: .
  image: sentinel-app:latest
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sentinel}
    CELERY_BROKER_URL: redis://redis:6379/0
    APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in .env}
    UPLOAD_DIR: /data/uploads
  volumes:
    - uploads:/data/uploads
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    # DEMO_SEED_DATA=true also fills the demo workspaces with sample reviews, threat models, risks and controls.
    command: ["sh", "-c", "python -m app.cli migrate && python -m app.cli bootstrap && if [ \"$${DEMO_SEED_DATA:-false}\" = true ]; then python scripts/seed_demo.py --all-workspaces; fi"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *app
    command: ["sh", "-c", "exec celery -A app.worker worker --loglevel=INFO --concurrency=${WORKER_CONCURRENCY:-2} -Q ${CELERY_QUEUE:-sentinel}"]
    environment:
      <<: *app-env
      CELERY_QUEUE: ${CELERY_QUEUE:-sentinel}
    # Warm shutdown on scale-in: running jobs finish first (unfinished ones are redelivered - acks_late).
    stop_grace_period: ${WORKER_STOP_GRACE:-30m}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  autoscaler:
    build: deploy/autoscaler
    image: sentinel-autoscaler:latest
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_QUEUE: ${CELERY_QUEUE:-sentinel}
      COMPOSE_PROJECT: sentinel
      COMPOSE_SERVICE: worker
      PROJECT_DIR: /project
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      MIN_WORKERS: ${MIN_WORKERS:-1}
      MAX_WORKERS: ${MAX_WORKERS:-6}
      POLL_SECONDS: ${AUTOSCALE_POLL_SECONDS:-10}
      SCALE_DOWN_DELAY: ${AUTOSCALE_SCALE_DOWN_DELAY:-120}
    volumes:
      # Docker API access is root-equivalent on the host; only run the autoscaler on hosts you control.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/project:ro
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
