PR.PS-06:
  why: Secure software development - CI/CD pipeline and source-control hardening, branch protection, required reviews
  controls: [SA-10, SA-15, SA-11, CM-3, CM-5]
  exclude: '(clusterroles?|certificatesigningrequest)'
PR.IR-01:
  why: Networks protected from unauthorised access - security groups / firewalls / private endpoints / public exposure / WAF / remote access
  controls: [SC-7, AC-4, AC-17]
  exclude: '(\blogs?\b|logging|flow log|encrypt|\bkms\b|\btls\b|\bssl\b|https|password)'
PR.IR-02: {checks: none, why: Environmental threats to facilities - physical / cloud provider inherited}
PR.IR-03:
  why: Resilience mechanisms - multi-AZ / zone redundancy / replication / failover / DDoS protection / health probes
  controls: [CP-6, CP-7, CP-10, SC-36, SC-5]
  include: '(multi[- ]?az|zone[- ]?redundan|availability zones?|replicas?|geo[- ]?redundan|high[- ]?availab|replication|failover|cross[- ]region|redundan|multi[- ]region|ddos|\bshield\b|health ?checks?|liveness|readiness|probes?)'
  exclude: '(encrypt|\bkms\b|minor|upgrade|publicly|public|data source)'
PR.IR-04:
  why: Adequate capacity - resource limits and requests, quotas, throttling / rate limiting, auto-scaling
  controls: [SC-5, SC-6]
  include: '(limits?|quotas?|throttl\w*|rate[- ]?limit\w*|rate[- ]based|concurren\w*|auto[- ]?scal\w*|capacity|requests? should be set|cpu requests?|memory requests?|event-qps)'
  exclude: '(supply tags|public ip|launch templates?)'

