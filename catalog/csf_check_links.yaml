# Curated requirement -> Checkov check links (read by the app at runtime).
#
# Every NIST CSF 2.0 subcategory has an entry. Requirement ids that are not
# listed here (e.g. future OWASP / AI RMF requirements) get NO automatic
# checks - only links added by reviewers on the Mappings page.
#
#   <requirement id>:
#     why: one line explaining the decision
#     checks: none               # organisational / procedural - no IaC evidence expected
#   or a link spec:
#     controls: [SC-28, SC-12]   # rule-derived (high-confidence) 800-53 controls of the check.
#                                # 'SC-28' matches SC-28 and its enhancements, 'CM-7(5)' matches exactly.
#                                # Category-default controls (low confidence) are never used.
#     categories: [LOGGING]      # Checkov categories
#     include: 'regex'           # check name must match (case-insensitive) - narrows controls/categories
#     exclude: 'regex'           # check name must not match
#     checks: [CKV_AWS_19]       # explicit ids - always linked
#
# Strength: strong = explicit id, rule-derived control match, or category match
# narrowed by `include`; related = category-only match without `include`.
# Reviewers can include / exclude checks on top of this (globally or per review).
# Restart the app after editing.

