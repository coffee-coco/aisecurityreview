# --------------------------------------------------------------------------- PROTECT
PR.AA-01:
  why: Identities and credentials managed - IAM users and service accounts, password policy, credential storage and hard-coded secrets
  controls: [AC-2, IA-5]
  exclude: '(encrypt|\bkms\b|\bcmks?\b|\btls\b|\bssl\b|non-root|root user)'
PR.AA-02: {checks: none, why: Identity proofing and binding to credentials - onboarding process}
PR.AA-03:
  why: Users / services / hardware authenticated - MFA, IdP / SSO integration, anonymous access disabled, API authentication
  controls: [IA-2, IA-8]
  exclude: 'hard[- ]?coded'
PR.AA-04:
  why: Identity assertions protected and verified - tokens, SAML / OIDC / OAuth flows
  controls: [IA-2, IA-5, IA-8]
  include: '(tokens?|\bjwt\b|json web token|saml|oidc|openid|oauth2?|implicit flow|password flow|assertions?|federat\w*|identity provider)'
  exclude: '(hard[- ]?coded|service account tokens?|mounted|encrypt\w*|at rest)'
PR.AA-05:
  why: Access permissions managed with least privilege - IAM / RBAC policies, wildcard and admin grants, public or cross-account resource policies
  controls: [AC-3, AC-6, AC-21]
  exclude: '(security groups?|ingress|egress|firewall|\bnsgs?\b|0\.0\.0\.0|::/0|port \d+|\bssh\b|\brdp\b|public ip|ip address|network access|internet|exposed|containers?|privilege escalation|capabilit|host (process|network|ipc|pid)|seccomp|encrypt|\btls\b|\bssl\b|password|\bmfa\b|multi[- ]factor|logg?ing|\blogs?\b)'
PR.AA-06: {checks: none, why: Physical access managed - facilities}
PR.AT-01: {checks: none, why: Awareness training - people}
PR.AT-02: {checks: none, why: Role-based training - people}
PR.DS-01:
  why: Data at rest protected - storage / database / disk encryption with managed keys and key rotation plus deletion protection
  controls: [SC-28, SC-12, CP-9, SI-7]
  include: '(encrypt|\bsse\b|at[- ]rest|\bcmks?\b|\bkms\b|customer[- ]managed keys?|\bcmek\b|\bbyok\b|key rotation|rotation|double encryption|infrastructure encryption|deletion protection|termination protection|object lock|mfa delete|soft[- ]delete|purge protection)'
  exclude: '(in[- ]transit|\btransit\b|\btls\b|\bssl\b|https|backups?|snapshots?|key polic)'
PR.DS-02:
  why: Data in transit protected - TLS versions / HTTPS-only / certificates / no cleartext protocols
  controls: [SC-8, SC-13]
  exclude: '(at[- ]rest|\bdisks?\b|\bvolumes?\b|clusterroles?|certificatesigningrequest)'
PR.DS-10:
  why: Data in use protected - confidential computing and data masking only
  controls: [SC-4, SC-39]
  include: '(confidential|enclaves?|data masking)'
PR.DS-11:
  why: Backups created / protected / maintained - backup plans, PITR, versioning, snapshot protection, geo-redundant backups
  controls: [CP-9, CP-6]
  include: '(backups?|snapshots?|point[- ]in[- ]time|\bpitr\b|versioning|restore|recovery|vault lock|object lock)'
  exclude: '(\blogs?\b|logging|\btrails?\b|cloudtrail|copy tags)'
PR.PS-01:
  why: Configuration management applied - hardened workload / container / cluster baselines, IMDSv2, debug disabled
  controls: [CM-6, CM-7, CM-2, SC-39, SI-11]
  checks: [CKV_K8S_27, CKV_K8S_86, CKV_K8S_88, CKV_K8S_89, CKV_K8S_113, CKV_K8S_115, CKV_K8S_145, CKV_K8S_146,
           CKV_GCP_22, CKV_GCP_24, CKV_GCP_68, CKV_GCP_71, CKV2_GCP_19, CKV_AZURE_232]
  exclude: '(security groups?|ingress|egress|firewall|\bnsgs?\b|network (acl|security)|0\.0\.0\.0|port \d+|public|encrypt|\bkms\b|\btls\b|\bssl\b|https|certificate|audit|\blogs?\b|logging|anonymous|authenticat|\bauth\b|rbac|secrets?|tokens?|password|backup|limits?|requests? should|probes?|liveness|readiness|confidential|enclave|\biam\b|management plane)'
PR.PS-02:
  why: Software maintained and replaced - automatic upgrades, patching, supported versions
  controls: [SI-2, SA-22]
  exclude: '(\btls\b|\bssl\b|encryption|latest (version )?tag|oauth|implicit flow)'
PR.PS-03: {checks: none, why: Hardware maintenance and disposal - physical asset process}
PR.PS-04:
  why: Log records generated and available - audit / access / flow / diagnostic logging and log retention
  controls: [AU-2, AU-3, AU-12, AU-11]
  checks: [CKV_AWS_50, CKV_AWS_73, CKV_AWS_284, CKV_GCP_110, CKV_AZURE_66]
  exclude: '(encrypt|\bkms\b|\bcmks?\b|iam polic\w*)'
PR.PS-05:
  why: Unauthorised software prevented - code-signing enforcement, admission control, binary authorisation, trusted registries
