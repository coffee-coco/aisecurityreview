# OWASP API Security Top 10 2023.
# Titles and text are the official risk summaries (editions/2023/en/0x11-t10.md).
# question/scope/baseline/triggers are the review layer (same conventions as csf_questions.yaml).
# controls / csf / cwe are left empty: no authoritative SP 800-53 / CSF mapping is applied here.
id: owasp_api
name: OWASP API Security Top 10
short: OWASP API
version: "2023"
order: 50
source: https://owasp.org/API-Security/editions/2023/en/0x11-t10/
applies_when: {any: [system:api, tech:openapi, service:api gateway, service:appsync]}
function:
  id: OWASP-API
  title: OWASP API Security Top 10 2023
  text: "The most critical security risks specific to APIs."
  color: ID
requirements:
  - id: OWASP-API.API1-2023
    title: "API1:2023 Broken Object Level Authorization"
    text: "APIs tend to expose endpoints that handle object identifiers, creating a wide attack surface of Object Level Access Control issues. Object level authorization checks should be considered in every function that accesses a data source using an ID from the user."
    question: "How does every API operation that takes an object ID verify the caller is allowed to access that specific object?"
    scope: project
    baseline: true
    triggers: [object id, record, tenant, account, customer]
  - id: OWASP-API.API2-2023
    title: "API2:2023 Broken Authentication"
    text: "Authentication mechanisms are often implemented incorrectly, allowing attackers to compromise authentication tokens or to exploit implementation flaws to assume other user's identities temporarily or permanently. Compromising a system's ability to identify the client/user, compromises API security overall."
    question: "How are API clients and users authenticated (standard protocols such as OAuth 2.0/OIDC, token validation and expiry, brute-force protection on auth endpoints)?"
    scope: project
    baseline: true
    triggers: [oauth, jwt, token, api key, authenticat]
  - id: OWASP-API.API3-2023
    title: "API3:2023 Broken Object Property Level Authorization"
    text: "This category combines API3:2019 Excessive Data Exposure and API6:2019 Mass Assignment, focusing on the root cause: the lack of or improper authorization validation at the object property level. This leads to information exposure or manipulation by unauthorized parties."
    question: "How does the API restrict which object properties each caller can read or write (response filtering, schema allow-lists, no mass assignment)?"
    scope: project
    triggers: [graphql, json, schema, update, patch, flag:personal_data]
  - id: OWASP-API.API4-2023
    title: "API4:2023 Unrestricted Resource Consumption"
    text: "Satisfying API requests requires resources such as network bandwidth, CPU, memory, and storage. Other resources such as emails/SMS/phone calls or biometrics validation are made available by service providers via API integrations, and paid for per request. Successful attacks can lead to Denial of Service or an increase of operational costs."
    question: "What rate limits, quotas, payload and pagination limits and spending caps protect the API and the paid services it calls?"
    scope: project
    triggers: [exposure:public, rate limit, upload, sms, email, lambda, quota]
  - id: OWASP-API.API5-2023
    title: "API5:2023 Broken Function Level Authorization"
    text: "Complex access control policies with different hierarchies, groups, and roles, and an unclear separation between administrative and regular functions, tend to lead to authorization flaws. By exploiting these issues, attackers can gain access to other users' resources and/or administrative functions."
    question: "How are administrative and privileged API functions separated and authorised (deny by default, role checks on every endpoint)?"
    scope: project
    baseline: true
    triggers: [admin, role, privileg, internal endpoint]
  - id: OWASP-API.API6-2023
    title: "API6:2023 Unrestricted Access to Sensitive Business Flows"
    text: "APIs vulnerable to this risk expose a business flow - such as buying a ticket, or posting a comment - without compensating for how the functionality could harm the business if used excessively in an automated manner. This doesn't necessarily come from implementation bugs."
    question: "Which business flows could be harmful if automated at scale (purchases, sign-ups, bookings, comments), and how is that abuse detected or limited?"
    scope: project
    triggers: [purchase, booking, checkout, payment, sign up, signup, referral, voucher, bot]
  - id: OWASP-API.API7-2023
    title: "API7:2023 Server Side Request Forgery"
    text: "Server-Side Request Forgery (SSRF) flaws can occur when an API is fetching a remote resource without validating the user-supplied URI. This enables an attacker to coerce the application to send a crafted request to an unexpected destination, even when protected by a firewall or a VPN."
    question: "Does the API fetch any user-supplied URL (webhooks, imports, previews), and how are destinations validated and network egress restricted?"
    scope: project
    triggers: [webhook, url, fetch, import, callback, preview]
  - id: OWASP-API.API8-2023
    title: "API8:2023 Security Misconfiguration"
    text: "APIs and the systems supporting them typically contain complex configurations, meant to make the APIs more customizable. Software and DevOps engineers can miss these configurations, or don't follow security best practices when it comes to configuration, opening the door for different types of attacks."
    question: "How are the API, gateway and supporting services hardened and verified (TLS, CORS, security headers, error messages, unused HTTP methods)?"
    scope: project
    triggers: [api gateway, cors, configuration, tls, gateway]
  - id: OWASP-API.API9-2023
    title: "API9:2023 Improper Inventory Management"
    text: "APIs tend to expose more endpoints than traditional web applications, making proper and updated documentation highly important. A proper inventory of hosts and deployed API versions also are important to mitigate issues such as deprecated API versions and exposed debug endpoints."
    question: "Is there an up-to-date inventory and specification (e.g. OpenAPI) of every API host, version and environment, and how are old versions and debug endpoints retired?"
    scope: project
    triggers: [openapi, swagger, version, deprecat, flag:change]
  - id: OWASP-API.API10-2023
    title: "API10:2023 Unsafe Consumption of APIs"
    text: "Developers tend to trust data received from third-party APIs more than user input, and so tend to adopt weaker security standards. In order to compromise APIs, attackers go after integrated third-party services instead of trying to compromise the target API directly."
    question: "Which third-party APIs does this service consume, and how are their responses validated, their connections secured and their redirects controlled?"
    scope: project
    triggers: [flag:third_party, integration, third-party api, partner, vendor]
