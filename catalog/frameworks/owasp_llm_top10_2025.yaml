# OWASP Top 10 for LLM Applications 2025 (OWASP GenAI Security Project).
# Titles are official; text is condensed from the official risk descriptions.
# question/scope/baseline/triggers are the review layer (same conventions as csf_questions.yaml).
# controls / csf are left empty: OWASP publishes no authoritative SP 800-53 / CSF mapping.
id: owasp_llm
name: OWASP Top 10 for LLM Applications
short: OWASP LLM
version: "2025"
order: 40
source: https://genai.owasp.org/llm-top-10/
applies_when: {any: [system:ai_agent, kw:llm, kw:large language model, kw:gpt, kw:chatbot, kw:prompt, kw:generative ai, kw:copilot]}
function:
  id: OWASP-LLM
  title: OWASP Top 10 for LLM Applications 2025
  text: "The most critical security risks for applications built on large language models."
  color: RS
requirements:
  - id: OWASP-LLM.LLM01
    title: "LLM01:2025 Prompt Injection"
    text: "A Prompt Injection Vulnerability occurs when user prompts alter the LLM's behavior or output in unintended ways. Inputs can affect the model even if they are imperceptible to humans, and can arrive directly from users or indirectly through external content such as websites, files or retrieved documents."
    question: "How does the solution resist direct and indirect prompt injection (untrusted content segregated from instructions, least-privilege tools, output validation, human approval for high-risk actions, adversarial testing)?"
    scope: project
    baseline: true
    triggers: [prompt, rag, retriev, document, email, browse, web search]
    examples: ["Constrain model behaviour and define expected output formats", "Segregate and identify external content", "Require human approval for high-risk actions"]
  - id: OWASP-LLM.LLM02
    title: "LLM02:2025 Sensitive Information Disclosure"
    text: "Sensitive information - personal data, financial details, health records, confidential business data, security credentials and legal documents, as well as proprietary model details - can be exposed through LLM outputs or the application context."
    question: "How is sensitive data prevented from reaching the model, leaking in responses, or being retained by the provider (data minimisation, redaction, access-scoped retrieval, provider data-use terms)?"
    scope: project
    baseline: true
    triggers: [flag:personal_data, pii, confidential, data:credentials, data:customer, training]
    examples: ["Sanitise and minimise data passed to the model", "Enforce access control on data sources used for retrieval", "Review the provider's data retention and training terms"]
  - id: OWASP-LLM.LLM03
    title: "LLM03:2025 Supply Chain"
    text: "LLM supply chains are susceptible to various vulnerabilities, which can affect the integrity of training data, models, and deployment platforms. These risks can result in biased outputs, security breaches, or system failures."
    question: "Which third-party models, adapters, datasets and LLM frameworks are used, and how are their provenance, licensing and integrity verified?"
    scope: project
    triggers: [flag:third_party, hugging, open-source model, pre-trained, fine-tun, lora, langchain, llamaindex, plugin]
    examples: ["Vet model and data sources and suppliers, including terms and privacy policies", "Maintain an SBOM / AI BOM for models and components", "Verify model integrity with signatures or hashes"]
  - id: OWASP-LLM.LLM04
    title: "LLM04:2025 Data and Model Poisoning"
    text: "Data poisoning occurs when pre-training, fine-tuning, or embedding data is manipulated to introduce vulnerabilities, backdoors, or biases. This manipulation can compromise model security, performance, or ethical behavior, leading to harmful outputs or impaired capabilities."
    question: "How are training, fine-tuning and embedding data sourced, validated and protected against tampering, and how would poisoning be detected?"
    scope: project
    triggers: [fine-tun, training data, embedding, vector, rag, knowledge base, user-generated]
    examples: ["Track data origins and transformations", "Validate data sources and outputs; sandbox untrusted data", "Red-team and monitor for signs of poisoning"]
  - id: OWASP-LLM.LLM05
    title: "LLM05:2025 Improper Output Handling"
    text: "Improper Output Handling refers specifically to insufficient validation, sanitization, and handling of the outputs generated by large language models before they are passed downstream to other components and systems."
    question: "How is model output treated as untrusted before it reaches browsers, databases, shells, code interpreters or other systems (encoding, validation, parameterisation)?"
    scope: project
    baseline: true
    triggers: [html, markdown, sql, code generation, execute, api, render]
    examples: ["Apply context-aware output encoding", "Use parameterised queries for any database operation driven by model output", "Apply a strict Content Security Policy"]
  - id: OWASP-LLM.LLM06
    title: "LLM06:2025 Excessive Agency"
    text: "An LLM-based system is often granted a degree of agency to call functions or interface with other systems via extensions (tools, skills or plugins). Excessive Agency is the vulnerability that enables damaging actions to be performed in response to unexpected, ambiguous or manipulated outputs from an LLM, rooted in excessive functionality, permissions or autonomy."
    question: "Which tools, permissions and autonomy does the LLM have, are they the minimum needed, and which actions require human approval?"
    scope: project
    triggers: [system:ai_agent, agent, tool, function calling, plugin, mcp, autonom]
    examples: ["Minimise extensions and the functionality within them", "Execute extensions in the user's context with least privilege", "Require human approval for high-impact actions"]
  - id: OWASP-LLM.LLM07
    title: "LLM07:2025 System Prompt Leakage"
    text: "The system prompt leakage vulnerability in LLMs refers to the risk that the system prompts or instructions used to steer the behavior of the model can also contain sensitive information that was not intended to be discovered."
    question: "Is the system prompt free of secrets, credentials and security-relevant logic, with controls enforced outside the model?"
    scope: project
    triggers: [system prompt, prompt, instruction]
    examples: ["Separate sensitive data from system prompts", "Do not rely on system prompts for strict behaviour control or authorisation"]
  - id: OWASP-LLM.LLM08
    title: "LLM08:2025 Vector and Embedding Weaknesses"
    text: "Vectors and embeddings vulnerabilities present significant security risks in systems utilizing Retrieval Augmented Generation (RAG) with Large Language Models (LLMs). Weaknesses in how vectors and embeddings are generated, stored, or retrieved can be exploited to inject harmful content, manipulate model outputs, or access sensitive information."
    question: "How is the vector store secured (permission-aware retrieval, tenant isolation, validated ingestion, protection against embedding inversion)?"
    scope: project
    triggers: [rag, retriev, vector, embedding, knowledge base, pinecone, opensearch, pgvector]
    examples: ["Permission and access control partitioning in the vector database", "Validate and authenticate data sources before ingestion", "Log and monitor retrieval activity"]
  - id: OWASP-LLM.LLM09
    title: "LLM09:2025 Misinformation"
    text: "Misinformation from LLMs poses a core vulnerability for applications relying on these models. Misinformation occurs when LLMs produce false or misleading information that appears credible, which can lead to security breaches, reputational damage and legal liability."
    question: "How are false or misleading answers limited (grounding, cross-checking, human review) and how are users told to verify AI output?"
    scope: project
    triggers: [hallucinat, advice, customer, decision, medical, legal, financial, code generation]
    examples: ["Use retrieval-augmented generation from verified sources", "Human oversight and fact-checking for critical information", "Communicate limitations to users"]
  - id: OWASP-LLM.LLM10
    title: "LLM10:2025 Unbounded Consumption"
    text: "Unbounded Consumption occurs when a Large Language Model (LLM) application allows users to conduct excessive and uncontrolled inferences, leading to risks such as denial of service (DoS), economic losses, model theft, and service degradation."
    question: "What rate limits, quotas, input-size limits, timeouts and cost alerts prevent abuse, denial of wallet or model extraction?"
    scope: project
    triggers: [flag:internet_facing, exposure:public, rate limit, quota, cost, api]
    examples: ["Input validation and size limits", "Rate limiting and user quotas", "Monitor resource usage and set budget alerts"]
